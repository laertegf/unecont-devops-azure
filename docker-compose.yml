# Ambiente local completo.
#
#   cp .env.example .env
#   docker compose up -d --build                           # API + Postgres (+ migração)
#   docker compose --profile observability up -d --build   # + Prometheus, Loki, Alloy e Grafana
#
# Ordem de subida garantida por healthcheck, não por "sleep":
#   postgres (healthy) -> migrate (termina com sucesso) -> api (healthy)
name: realworld

x-api-image: &api-image
  image: ${API_IMAGE:-realworld-api:local}
  build:
    context: .

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realworld}
      POSTGRES_USER: ${POSTGRES_USER:-realworld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Migração como passo separado: roda uma vez, termina, e só então a API sobe.
  # Mesma imagem da API, então schema e código nunca ficam fora de sincronia.
  migrate:
    <<: [*api-image, *hardening]
    # Binário direto em vez de npx: com filesystem read-only o npx tentaria escrever cache no $HOME.
    command: ["./node_modules/.bin/prisma", "migrate", "deploy", "--schema", "prisma/schema.prisma"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-realworld}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-realworld}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: [*api-image, *hardening]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-realworld}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-realworld}?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  ###########################################################################
  # Observabilidade (profile "observability")
  #   Alloy lê os logs dos containers pelo socket do Docker e manda para o Loki.
  #   Prometheus faz scrape do /metrics da API.
  #   Grafana já sobe com os datasources e o dashboard provisionados.
  ###########################################################################
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.1
    profiles: ["observability"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Somente leitura: o Alloy só descobre containers e lê logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.10
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/realworld-api.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    # Para o datasource "Prometheus (kind)" alcançar o port-forward no host.
    # No Docker Desktop o nome já existe; no Linux o host-gateway o cria.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  pgdata:
  prometheus-data:
  loki-data:
  grafana-data:
