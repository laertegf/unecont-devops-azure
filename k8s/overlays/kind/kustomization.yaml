apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Segredos vêm de um arquivo local fora do git (secrets.env), criado pelo scripts/kind-up.sh
# com valores aleatórios. Em produção: Azure Key Vault + Secrets Store CSI Driver
# (ou External Secrets Operator), nunca Secret versionado.
secretGenerator:
  - name: api-secrets
    namespace: realworld
    envs:
      - secrets.env

patches:
  # No kind a API é exposta por NodePort (mapeado para localhost:8080 no kind-cluster.yaml).
  - target:
      kind: Service
      name: api
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
